<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Zoya!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      max-width: 90%;
      width: 350px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      animation: pop 1s ease-in-out infinite alternate;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.5;
    }
    .btn {
      margin-top: 20px;
      padding: 12px 25px;
      background: #fff;
      color: #ff4b2b;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    @keyframes pop {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 Happy Birthday Zoya! 🎂</h1>
    <p>Aapko Janamdin ki Bhot Bhot Mubarakbaad! ✨<br>May your year be filled with happiness, success, and endless joy!</p>
    <button class="btn" onclick="alert('🎈 Wishing you the best day ever, Zoya! ✨')">Click for Surprise 🎉</button>
  </div>
</body>
</html>
